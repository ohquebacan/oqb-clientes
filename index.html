<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clientes OQB</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #e4002b; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4211b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --card: #1f1f22; --ink: #f2f2f4; --muted: #a0a0a8; --line: #333338;
            --ok: #48c27a; --warn: #e3a33a; --bad: #ff6a63; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  header { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 16px; }
  header h1 { font-size: 22px; margin: 0; }
  header span { color: var(--accent); font-weight: 700; }
  nav { display: flex; gap: 6px; margin-bottom: 16px; }
  nav button { flex: 1; padding: 10px 6px; border: 1px solid var(--line); background: var(--card);
               color: var(--ink); border-radius: 10px; font-size: 15px; }
  nav button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 12px; font-size: 17px; border: 1px solid var(--line); border-radius: 10px;
                    background: var(--bg); color: var(--ink); }
  input.codigo { font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; text-transform: uppercase; }
  button.main { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; font-weight: 600; border: 0;
                border-radius: 12px; background: var(--accent); color: #fff; }
  button.main:disabled { opacity: .5; }
  button.sec { padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .msg { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 15px; }
  .msg.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .msg.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .msg.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
  .muted { color: var(--muted); font-size: 14px; }
  ul.lista { list-style: none; padding: 0; margin: 0; }
  ul.lista li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  ul.lista li:last-child { border-bottom: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  .sello { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .sello.ok { color: var(--ok); } .sello.bad { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header><h1>Clientes <span>OQB</span></h1></header>

  <!-- Verificacion de un codigo de soporte (se abre sola desde el QR) -->
  <section id="v-soporte" hidden>
    <div class="card" id="soporte-card"></div>
    <button class="sec" id="ir-inicio">Ir a registrar clientes</button>
  </section>

  <section id="v-app">
    <nav>
      <button data-tab="registrar" aria-pressed="true">Registrar</button>
      <button data-tab="clientes">Clientes</button>
      <button data-tab="config">Configurar</button>
    </nav>

    <div class="card" data-panel="registrar">
      <p class="muted">En la consola: Acerca de → Cliente OQB → Registrar. Copia el código que aparece.</p>
      <label for="codigo">Código de la consola</label>
      <input id="codigo" class="codigo" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XX">
      <label for="nombre">Nombre del cliente</label>
      <input id="nombre" autocomplete="off" placeholder="Nombre y apellido">
      <button class="main" id="registrar">Registrar</button>
      <div id="reg-msg"></div>
    </div>

    <div class="card" data-panel="clientes" hidden>
      <input id="buscar" placeholder="Buscar por nombre o código">
      <p class="muted" id="cli-estado">Cargando…</p>
      <ul class="lista" id="cli-lista"></ul>
    </div>

    <div class="card" data-panel="config" hidden>
      <p class="muted">Se guarda solo en este teléfono. Hace falta una sola vez.</p>
      <label for="semilla">Clave privada (semilla-privada-base64.txt)</label>
      <input id="semilla" type="password" autocomplete="off">
      <label for="token">Token de GitHub (solo oqb-clientes y oqb-clientes-registro, permiso de contenido)</label>
      <input id="token" type="password" autocomplete="off">
      <button class="main" id="guardar">Guardar</button>
      <div id="cfg-msg"></div>
    </div>
  </section>
</main>

<script type="module">
import * as ed from "https://cdn.jsdelivr.net/npm/@noble/ed25519@2.1.0/+esm";
import * as oqb from "./oqb-cliente.js";

const PUBLICO = "ohquebacan/oqb-clientes";
const PRIVADO = "ohquebacan/oqb-clientes-registro";
const $ = (id) => document.getElementById(id);

function leer(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function guardar(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function aviso(el, tipo, texto) { el.innerHTML = ""; const d = document.createElement("div"); d.className = "msg " + tipo; d.textContent = texto; el.appendChild(d); }
function hoy() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fechaLegible(f) { const [a, m, d] = (f || "").split("-"); return d ? `${d}/${m}/${a}` : f; }
const utf8 = { a64: (t) => oqb.bytesABase64(new TextEncoder().encode(t)), de64: (b) => new TextDecoder().decode(oqb.base64ABytes(b.replace(/\n/g, ""))) };

// --- GitHub -------------------------------------------------------------
async function gh(metodo, repo, ruta, cuerpo) {
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${ruta}`, {
    method: metodo,
    headers: { Authorization: "Bearer " + leer("oqb_token"), Accept: "application/vnd.github+json" },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    cache: "no-store",
  });
  if (r.status === 404 && metodo === "GET") return null;
  if (!r.ok) throw new Error(r.status === 401 ? "El token de GitHub no es válido (Configurar)." : `GitHub respondió ${r.status}.`);
  return r.json();
}
async function leerJson(repo, ruta) {
  const f = await gh("GET", repo, ruta);
  return f ? { sha: f.sha, datos: JSON.parse(utf8.de64(f.content)) } : { sha: null, datos: null };
}
async function escribirJson(repo, ruta, datos, sha, mensaje) {
  return gh("PUT", repo, ruta, { message: mensaje, content: utf8.a64(JSON.stringify(datos, null, 2) + "\n"), sha: sha || undefined });
}

// --- Pestañas -----------------------------------------------------------
function pestana(nombre) {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === nombre)));
  document.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== nombre));
  if (nombre === "clientes") cargarClientes();
}
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => pestana(b.dataset.tab)));

// --- Configurar ---------------------------------------------------------
$("guardar").addEventListener("click", async () => {
  const semilla = $("semilla").value.trim(), token = $("token").value.trim();
  try {
    if (semilla) {
      const bytes = oqb.base64ABytes(semilla);
      if (bytes.length !== 32 || oqb.bytesAHex(await ed.getPublicKeyAsync(bytes)) !== oqb.CLAVE_PUBLICA_HEX)
        throw new Error("Esa clave no es la de OQB: revisa que copiaste semilla-privada-base64.txt completa.");
      guardar("oqb_semilla", semilla);
    }
    if (token) guardar("oqb_token", token);
    $("semilla").value = ""; $("token").value = "";
    aviso($("cfg-msg"), "ok", "Guardado en este teléfono.");
  } catch (e) { aviso($("cfg-msg"), "bad", e.message); }
});

// --- Registrar ----------------------------------------------------------
$("registrar").addEventListener("click", async () => {
  const msg = $("reg-msg"), boton = $("registrar");
  const nombre = $("nombre").value.trim().replace(/\s+/g, " ");
  try {
    if (!leer("oqb_semilla") || !leer("oqb_token")) throw new Error("Primero completa Configurar.");
    const idhex = await oqb.leerCodigo($("codigo").value);
    if (!nombre) throw new Error("Falta el nombre del cliente.");
    boton.disabled = true; aviso(msg, "warn", "Registrando…");

    const archivo = await oqb.archivoDe(idhex);
    const ruta = `l/${archivo}.json`;
    const previo = await gh("GET", PUBLICO, ruta);
    if (previo) {
      const antes = await oqb.verificar(ed, idhex, JSON.parse(utf8.de64(previo.content)));
      if (!confirmarReemplazo()) {
        aviso(msg, "warn", `Esta consola ya está registrada${antes ? " a nombre de " + antes : ""}. Toca Registrar otra vez para reemplazarla.`);
        return;
      }
    }

    const fecha = hoy();
    const cert = await oqb.emitir(ed, oqb.base64ABytes(leer("oqb_semilla")), idhex, nombre, fecha);
    // El mensaje del commit no lleva el nombre: el repositorio es publico.
    await escribirJson(PUBLICO, ruta, cert, previo ? previo.sha : null, "Certificado " + fecha);

    const reg = await leerJson(PRIVADO, "registro.json");
    const lista = (reg.datos || []).filter((c) => c.codigo !== idhex);
    lista.push({ nombre, codigo: idhex, archivo, fecha });
    await escribirJson(PRIVADO, "registro.json", lista, reg.sha, "Cliente: " + nombre);

    aviso(msg, "ok", `Listo: ${nombre} quedó registrado. En la consola: Acerca de → Cliente OQB → Activar (con internet).`);
    $("codigo").value = ""; $("nombre").value = "";
  } catch (e) { aviso(msg, "bad", e.message); }
  finally { boton.disabled = false; }
});

// Reemplazar exige tocar Registrar otra vez con los mismos datos: sin dialogos,
// que en el visor no siempre se muestran.
let pendienteReemplazo = "";
function confirmarReemplazo() {
  const clave = $("codigo").value + "|" + $("nombre").value;
  if (pendienteReemplazo === clave) { pendienteReemplazo = ""; return true; }
  pendienteReemplazo = clave;
  return false;
}

// --- Clientes -----------------------------------------------------------
let clientes = [];
async function cargarClientes() {
  const estado = $("cli-estado");
  if (!leer("oqb_token")) { estado.textContent = "Primero completa Configurar."; return; }
  estado.textContent = "Cargando…";
  try {
    clientes = ((await leerJson(PRIVADO, "registro.json")).datos || []).slice().reverse();
    pintarClientes();
  } catch (e) { estado.textContent = e.message; }
}
async function pintarClientes() {
  const q = $("buscar").value.trim().toLowerCase().replace(/-/g, "");
  const ul = $("cli-lista"); ul.innerHTML = "";
  const vistos = clientes.filter((c) => !q || c.nombre.toLowerCase().includes(q) || c.codigo.includes(q));
  $("cli-estado").textContent = `${vistos.length} de ${clientes.length} clientes`;
  for (const c of vistos) {
    const li = document.createElement("li");
    const n = document.createElement("div"); n.textContent = c.nombre;
    const d = document.createElement("div"); d.className = "mono"; d.textContent = `${await oqb.codigoDe(c.codigo)} · ${fechaLegible(c.fecha)}`;
    li.append(n, d); ul.appendChild(li);
  }
}
$("buscar").addEventListener("input", pintarClientes);

// --- Verificar un codigo de soporte -------------------------------------
async function mostrarSoporte(datos) {
  const card = $("soporte-card"); card.innerHTML = "";
  const valido = await oqb.verificarSoporte(ed, datos);
  const sello = document.createElement("div");
  sello.className = "sello " + (valido ? "ok" : "bad");
  sello.textContent = valido ? "✓ Cliente OQB verificado" : "✗ No es un cliente OQB válido";
  card.appendChild(sello);

  const filas = [
    ["Cliente", datos.n], ["Desde", fechaLegible(datos.f)], ["Código", await oqb.codigoDe(datos.id)],
    ["Modelo", datos.mod], ["Firmware", datos.fw], ["Atmosphère", datos.ams], ["App", datos.app],
    ["Pack", datos.pack], ["Protecciones", datos.prot], ["Generado", datos.t],
  ];
  const dl = document.createElement("dl");
  for (const [k, v] of filas) {
    if (!v) continue;
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  card.appendChild(dl);

  if (Array.isArray(datos.err) && datos.err.length) {
    const h = document.createElement("p"); h.className = "muted"; h.textContent = "Últimos errores:";
    const ul = document.createElement("ul"); ul.className = "lista";
    for (const [nombre, veces, codigo, fecha] of datos.err) {
      const li = document.createElement("li");
      li.textContent = `${nombre} — ${veces} ${veces === 1 ? "vez" : "veces"}, código ${codigo}, último ${fecha}`;
      ul.appendChild(li);
    }
    card.append(h, ul);
  }
}

$("ir-inicio").addEventListener("click", () => { history.replaceState(null, "", location.pathname); $("v-soporte").hidden = true; $("v-app").hidden = false; });

const m = location.hash.match(/[#&]s=([^&]+)/);
if (m) {
  $("v-app").hidden = true; $("v-soporte").hidden = false;
  try { await mostrarSoporte(JSON.parse(utf8.de64(m[1]))); }
  catch (e) { aviso($("soporte-card"), "bad", "Este código de soporte está incompleto o dañado."); }
}
</script>
</body>
</html>
